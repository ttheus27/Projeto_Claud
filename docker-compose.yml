services:
  ms-orcamentos-mongo:
    build: ./services/ms-orcamentos-mongo
    env_file: ./services/ms-orcamentos-mongo/.env
    environment:
      PORT: 3001
    expose:
      - "3001"
    restart: unless-stopped

  ms-pedidos-sql:
    build: ./services/ms-pedidos-sql
    env_file: ./services/ms-pedidos-sql/.env
    environment:
      PORT: 3002
    expose:
      - "3002"
    restart: unless-stopped

  bff:
    build: ./services/bff
    env_file: ./services/bff/.env
    environment:
      PORT: 8080
      MS_MONGO_URL: http://ms-orcamentos-mongo:3001/api/orcamentos
      MS_SQL_URL: http://ms-pedidos-sql:3002/api/pedidos
    expose:
      - "8080"
    depends_on:
      - ms-orcamentos-mongo
      - ms-pedidos-sql
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: ./services/api-gateway/.env
    environment:
      PORT: 8090
      BFF_URL: http://bff:8080
      FRONTEND_DIR: /app/public
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    depends_on:
      - bff
    restart: unless-stopped
